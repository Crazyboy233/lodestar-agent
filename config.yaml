# ============================================================
# 主 agent 配置（走你自己的 DeepSeek API）
# ============================================================
main_agent:
  # DeepSeek 官方地址；若用中转/代理，改成对应的 OpenAI 兼容 base_url
  base_url: "https://api.deepseek.com"
  # 不要在这里写 key（本文件会进版本库）：
  # 放到 config.local.yaml 的 main_agent.api_key（已 gitignore），或设环境变量 DEEPSEEK_API_KEY
  api_key: ""
  model: "deepseek-flash"        # 官方线路: deepseek-chat / deepseek-reasoner；若供应商提供 flash 型号，改成对应 id
  temperature: 0.2
  max_retries: 3                # 主 agent 模型请求失败时的重试次数，超限则终止流程
  plan_retries: 2               # 拆解任务方案时，输出解析不成 JSON 的重试次数（与上面的请求重试分开计）

# ============================================================
# worker agent 配置（复用本机 codebuddy CLI 的无头模式）
# ============================================================
worker:
  cli: "codebuddy"
  model: ""                     # 留空 = 用 CLI 默认模型；也可填 deepseek-v4.1-flash 等
  workdir: "./workspace"        # worker 的落地目录（它的 cwd）
  timeout_seconds: 600          # 单个子任务超时；超时后重试会接着同一个 CLI 会话续跑
  max_turns: 0                  # 单次执行最多多少轮；0 = 不传 --max-turns（CLI 非交互默认 500）
  max_retries: 2                # 执行失败（超时/429/CLI 报错）重试次数，超限则终止流程
  allowed_tools: "Read,Write,Edit,Bash"
  add_dirs: []                  # 需要额外授权的目录，如 [".."]
  # 额外注入给 worker 的环境变量（一般不用；若要免登录用 token，取消注释）
  # env:
  #   CODEBUDDY_AUTH_TOKEN: "在这里填你的 CodeBuddy token"

# ============================================================
# 验收 agent 配置（独立模型、独立会话，同样走 codebuddy CLI）
# ============================================================
verifier:
  cli: "codebuddy"
  model: ""                     # 想换第三个模型就填这里，如 deepseek-v4.1-flash；留空用 CLI 默认
  timeout_seconds: 180
  allowed_tools: "Read,Write,Bash"  # 自己写 test 脚本需要 Write；被测目录只读，脚本写到 scratch_dir
  scratch_dir: ".verify"        # 测试脚本目录（相对 workdir），避免污染 worker 产出
  max_rounds: 3                 # 同一条子任务最多「执行 → 验收」几轮，防死循环
  max_retries: 2                # 验收 agent 自身请求失败重试次数，超限则终止流程

# ============================================================
# Web 控制台（引导 / 边界退出 / 实时输出）
# 也可以不改这里，直接用命令行 --web --port 启动
# ============================================================
ui:
  web: false                    # true = 不写 --web 也默认开控制台
  host: "127.0.0.1"             # 只监听本机；要暴露到局域网改成 0.0.0.0
  port: 8788                    # 被占用时自动回退到随机端口（实际地址会打印出来）
  drain_timeout_seconds: 120    # 点退出后最多再等多久：等当前这次模型回复跑完，超时才强杀
  # 页面上「worker / 验收」两个下拉的候选模型；不写就用内置列表（取自 codebuddy --help）。
  # 空字符串 = 不传 --model，由 CLI 自己决定。
  # models: ["", "deepseek-v4.1-flash", "deepseek-v4-pro", "glm-5.3", "kimi-k3.1-pro"]
